<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#1E3A30; --green:#2A5748; --greenD:#1F4337; --red:#E8431E;
  --yellow:#F1D14E; --pink:#E65C6E; --teal:#6BD4CD; --cream:#F5F1EC;
  --paper:#EFE6D3; --grey:#9AA8A0;
  --cell:#2F6252; --cellOn:#F1D14E; --capTan:#D9C9A3; --capPink:#E9A3AC;
}
html,body{min-height:100%}
body{
  font-family:"Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
  background:var(--green); color:var(--ink);
  display:flex; justify-content:center;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
#app{width:100%;max-width:560px;display:flex;flex-direction:column;
  min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px - env(safe-area-inset-bottom))}
.screen{display:none;flex-direction:column;gap:10px;flex:1;min-height:0}
.screen.on{display:flex}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:16px}
h1{font-size:25px;line-height:1.3;letter-spacing:.5px}
h2{font-size:19px;line-height:1.4}
h3{font-size:15px;line-height:1.5}
p,li{font-size:14px;line-height:1.75;text-wrap:pretty}
.nb{white-space:nowrap}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;
     padding:3px 10px;border-radius:999px;letter-spacing:1px}
.sub{color:var(--green);font-size:13px;line-height:1.7}
.hl{background:var(--yellow);padding:1px 5px;border-radius:4px;font-weight:700}
.btn{font-family:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--red);
     border:3px solid var(--ink);border-radius:999px;padding:11px 22px;cursor:pointer;
     box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.sec{background:var(--cream);color:var(--ink)}
.btn.dark{background:var(--green)}
a.btn{text-decoration:none;display:inline-block}
.btn.sm{font-size:13px;padding:8px 15px;border-width:2.4px;box-shadow:0 2.4px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.howbox{background:#fff;border:2.4px dashed var(--green);border-radius:12px;padding:12px 14px;text-align:left}
.howbox h3{color:var(--green);margin-bottom:6px}
.howbox ol{padding-left:19px}
.howbox li{margin:3px 0}
.howbox .tip{margin-top:9px;padding:7px 10px;background:#FDEEF0;border-radius:8px;
  color:var(--pink);font-size:12.5px;line-height:1.7;font-weight:700;text-wrap:pretty}
.howbox .tip b{color:#C9344A}

/* ---------- 對話框 ---------- */
.bubble{position:relative;background:#fff;border:2.6px solid var(--ink);border-radius:14px;
        padding:9px 13px;font-size:13.5px;line-height:1.6;font-weight:700;text-align:left;text-wrap:pretty}
.bubble::after{content:"";position:absolute;width:0;height:0;border:8px solid transparent}
.bubble.lf::after{left:-11px;top:50%;margin-top:-8px;border-right-color:var(--ink);border-left:0}
.withhen{display:flex;align-items:center;gap:11px}
.withhen > svg{width:74px;flex:0 0 74px;height:auto}
.withhen .bubble{flex:1}

/* ---------- 開始頁 ---------- */
.hero{text-align:center}
#startHenBig{width:118px;margin:8px auto 0}
#startHenBig svg{display:block;width:100%}

/* ---------- 計數列 ---------- */
.bar{display:flex;align-items:center;gap:8px;background:var(--greenD);border:2.6px solid var(--ink);
  border-radius:12px;padding:7px 11px;color:#fff;flex-wrap:wrap;row-gap:6px}
.bar .lb{font-size:13px;font-weight:700;white-space:nowrap}
.bar .lb b{font-size:17px;color:var(--yellow)}
.bar .sp{flex:1;min-width:4px}
.bar .egg{font-size:12px;font-weight:700;color:#A8C0B2;white-space:nowrap}
.bar .egg.got{color:var(--pink)}

/* ---------- 字母格 ---------- */
.gridwrap{background:var(--greenD);border:3px solid var(--ink);border-radius:16px;padding:9px}
#grid{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.caps{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;border-radius:999px;background:var(--capTan);opacity:.95}
.cap.egg{background:var(--capPink)}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr)}
.cell{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--cream);
  font-size:clamp(11px,3.4vw,19px);position:relative;border-right:1px dashed rgba(255,255,255,.12);
  border-bottom:1px dashed rgba(255,255,255,.12)}
.cell.sel{background:rgba(241,209,78,.42);border-radius:4px}
.hintbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.words{display:flex;flex-wrap:wrap;gap:5px}
.wd{font-size:11.5px;font-weight:700;color:#CFE0D4;background:rgba(255,255,255,.12);
  border-radius:999px;padding:3px 9px;letter-spacing:.3px}
.wd.got{background:var(--capTan);color:var(--ink);text-decoration:line-through}

/* ---------- 結果 ---------- */
.res{border-radius:14px;padding:14px 15px;border:3px solid var(--ink);background:#E8F4EA}
.res .ttl{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--green)}
.res p{font-size:13.5px;line-height:1.8}
.pop{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;
  background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:11px 16px;
  font-size:14px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.3);display:flex;align-items:center;gap:9px;
  animation:popin .4s ease-out both;max-width:92vw}
.pop .hn{width:40px;flex:0 0 40px}
.pop .hn svg{display:block;width:100%}
@keyframes popin{from{opacity:0;transform:translateX(-50%) translateY(14px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ---------- 結束頁 ---------- */
.code{text-align:center;background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px}
.code .k{font-size:12px;letter-spacing:3px;text-indent:3px;opacity:.9}
.code .v{font-size:46px;font-weight:700;color:var(--yellow);line-height:1.15}
.todo{display:flex;gap:11px;align-items:flex-start}
.todo + .todo{margin-top:13px;padding-top:13px;border-top:2px dashed var(--grey)}
.todo .no{flex:0 0 26px;height:26px;margin-top:1px;border-radius:50%;background:var(--red);color:#fff;
  font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.todo h3{color:var(--green);margin-bottom:4px}
.todo p{font-size:12.5px;line-height:1.75;color:#4A5B52;text-wrap:pretty}
.note{background:#fff;border-left:5px solid var(--teal);border-radius:0 9px 9px 0;padding:10px 12px;
  font-size:12.5px;line-height:1.75;margin-top:11px;text-wrap:pretty}

/* ---------- 頁尾 ---------- */
footer{margin-top:10px;text-align:center;color:#CFE0D4;font-size:11px;line-height:1.75}
footer a{color:var(--yellow)}
footer b{color:#fff}

@media(min-width:560px){ h1{font-size:29px} .cell{font-size:21px} }
</style>
</head>

<script>
/* 阿雞與道具：全部自繪 SVG，無外部圖檔。可單獨用 node 產生預覽。 */
const ART = (() => {
  const INK = '#1E3A30', RED = '#E8431E', ORANGE = '#E8873A', GREY = '#9AA8A0',
        WHITE = '#FFFFFF', YELLOW = '#F1D14E', TEAL = '#6BD4CD', CREAM = '#F5F1EC',
        GREEN = '#2A5748', PINK = '#E65C6E', BROWN = '#8C6B4A', TEALD = '#35A49D';

  /* ---- 阿雞 ----
     opts: face  normal | happy | wow | sad | wink
           acc   none | santa | glasses | scarf | nurse | case
           flip  true 面向左
     表情只用眼睛表示：阿雞只有一個嘴（喙）。                       */
  function hen(o) {
    o = o || {};
    const face = o.face || 'normal', acc = o.acc || 'none';

    // 瞇眼笑（∩ 形）
    const arc = (cx) => '<path d="M' + (cx - 4) + ' 47q4-5.5 8 0" stroke="' + INK +
      '" stroke-width="3" fill="none" stroke-linecap="round"/>';
    const dot = (cx) => '<circle cx="' + cx + '" cy="46" r="3.6" fill="' + INK + '"/>';
    const wide = (cx) => '<circle cx="' + cx + '" cy="46" r="6.2" fill="' + WHITE +
      '" stroke="' + INK + '" stroke-width="2.6"/>' +
      '<circle cx="' + (cx + 1) + '" cy="47.2" r="3" fill="' + INK + '"/>';

    let eye;
    if (face === 'happy')      eye = arc(54) + arc(67);
    else if (face === 'wow')   eye = wide(54) + wide(67);
    else if (face === 'sad')   eye = '<circle cx="54" cy="48" r="3.2" fill="' + INK + '"/>' +
                                     '<circle cx="67" cy="48" r="3.2" fill="' + INK + '"/>' +
                                     '<path d="M48 39l10 4M73 39l-10 4" stroke="' + INK +
                                     '" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    else if (face === 'wink')  eye = dot(54) + arc(67);
    else                       eye = dot(54) + dot(67);

    let accSvg = '', front = '';
    if (acc === 'santa') {
      accSvg = '<path d="M30 26q6-20 26-20 16 0 22 14l-4 6z" fill="' + RED + '" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round"/>' +
               '<rect x="26" y="24" width="56" height="9" rx="4.5" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.6"/>' +
               '<circle cx="80" cy="12" r="7" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.6"/>';
    } else if (acc === 'glasses') {
      accSvg = '<g fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-linecap="round">' +
               '<circle cx="54" cy="46" r="9.5"/><circle cx="70" cy="46" r="9.5"/>' +
               '<path d="M63.5 45.5h-3"/><path d="M44.8 43.5q-6-2-9.8 1.4"/></g>' +
               '<path d="M45.6 54.4q-4.6 11-1.6 21" stroke="' + GREY +
               '" stroke-width="1.7" fill="none" stroke-linecap="round"/>';
    } else if (acc === 'scarf') {
      /* 圍在脖子，比翅膀高；搭配下方較低的翅膀，兩者都看得見 */
      accSvg = '<path d="M21 57q34 13 67 0l-3.5 11q-30 11-60 0z" fill="' + TEAL +
               '" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round"/>' +
               '<path d="M36 62.6l-1.2 7.4M50 64.4l-0.9 7.6M64 63.4l-0.6 7.6" stroke="' + TEALD +
               '" stroke-width="2" fill="none" stroke-linecap="round"/>' +
               '<path d="M23.5 69l-5.5 21 11 3 4-20z" fill="' + TEAL +
               '" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round"/>' +
               '<path d="M18.6 91.4l-1.6 5.4M22.6 92.6l-1.2 5.4M26.6 93.6l-0.8 5.4" stroke="' + INK +
               '" stroke-width="2" fill="none" stroke-linecap="round"/>' +
               '<ellipse cx="28" cy="65.5" rx="7.5" ry="6" fill="' + TEAL +
               '" stroke="' + INK + '" stroke-width="2.6"/>';
    } else if (acc === 'nurse') {
      accSvg = '<path d="M35 25q4-18 20-18t20 18q-20-6-40 0z" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round"/>' +
               '<path d="M51 15.5h8M55 11.5v8" stroke="' + TEAL + '" stroke-width="3.2" stroke-linecap="round"/>';
    } else if (acc === 'mic') {
      /* 麥克風：頭在喙旁邊，握把斜斜壓過翅膀 */
      front = '<g transform="rotate(50 70 67)">' +
              '<rect x="61.5" y="56.5" width="17" height="21" rx="8.5" fill="#55615B" stroke="' + INK + '" stroke-width="2.6"/>' +
              '<path d="M64.5 62h11M64.5 67h11M64.5 72h11" stroke="' + INK + '" stroke-width="1.6" stroke-linecap="round"/>' +
              '<path d="M70 78v26" stroke="#7E8A84" stroke-width="6.5" stroke-linecap="round"/>' +
              '<path d="M70 78v26" stroke="' + INK + '" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".5"/>' +
              '</g>';
    } else if (acc === 'case') {
      front = '<path d="M15 78v-3q0-4 4-4h8q4 0 4 4v3" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-linecap="round"/>' +
              '<rect x="5" y="78" width="36" height="24" rx="3.5" fill="' + BROWN + '" stroke="' + INK + '" stroke-width="2.6"/>' +
              '<path d="M5.5 86.5h35" stroke="' + INK + '" stroke-width="2.2"/>' +
              '<rect x="18.5" y="82" width="9" height="8" rx="1.6" fill="' + YELLOW + '" stroke="' + INK + '" stroke-width="2"/>';
    }

    const comb = (acc === 'santa' || acc === 'nurse') ? '' :
      '<path d="M40 22q2-10 8-6 2-10 9-5 3-8 9 1l-2 12z" fill="' + RED + '" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round"/>';

    return '<svg viewBox="0 0 110 118" class="hen"' + (o.flip ? ' style="transform:scaleX(-1)"' : '') + ' aria-hidden="true">' +
      '<path d="M44 96v12M36 108h14M66 96v12M58 108h14" stroke="' + ORANGE + '" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
      comb +
      '<ellipse cx="55" cy="60" rx="34" ry="37" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3"/>' +
      /* 翅膀：封閉的葉形，有外框，貼在身側。圍巾款往下挪，才不會被圍巾蓋住 */
      (acc === 'scarf'
        ? '<path d="M30 66C46 67 55 76 56 88 42 94 30 87 28 77 27 71 27 67 30 66Z" fill="' + CREAM +
          '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
          '<path d="M36.5 76q7 2.5 12.5 8M34.5 83q6 1.5 10.5 5" stroke="' + GREY +
          '" stroke-width="1.8" fill="none" stroke-linecap="round"/>'
        : '<path d="M31 55C47 56 56 66 57 79 43 86 31 78 29 67 28 61 28 56 31 55Z" fill="' + CREAM +
          '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
          '<path d="M37.5 65q7 2.5 12.5 8.5M35.5 72.5q6 1.5 10.5 5.5" stroke="' + GREY +
          '" stroke-width="1.8" fill="none" stroke-linecap="round"/>') +
      eye + accSvg +
      /* 喙：阿雞只有這一個嘴。畫在配件之後，圍巾才不會蓋住它 */
      '<path d="M84 56l14 6-14 6z" fill="' + ORANGE + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      front + '</svg>';
  }

  /* ---- 蛋（可寫字）：寬高比 1:1.35 ---- */
  const EGGPATH = 'M50 5C70 5 90 44 90 72C90 95.5 72 113 50 113C28 113 10 95.5 10 72C10 44 30 5 50 5Z';
  const EGGBOX = { w: 100, h: 118 };
  function egg(fill, stroke, dash) {
    return '<svg viewBox="0 0 100 118" class="eggsvg" aria-hidden="true"><path class="sh" d="' + EGGPATH +
      '" fill="' + (fill || WHITE) + '" stroke="' + (stroke || INK) + '" stroke-width="3"' +
      (dash ? ' stroke-dasharray="8 7"' : '') + '/></svg>';
  }

  /* ---- 雜物 ---- */
  function book() {
    return '<svg viewBox="0 0 110 100" aria-hidden="true">' +
      '<path d="M55 24C44 14 24 13 12 18v62c12-5 32-4 43 6z" fill="' + CREAM + '" stroke="' + INK + '" stroke-width="3.4" stroke-linejoin="round"/>' +
      '<path d="M55 24c11-10 31-11 43-6v62c-12-5-32-4-43 6z" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3.4" stroke-linejoin="round"/>' +
      '<path d="M55 24v62" stroke="' + INK + '" stroke-width="3"/>' +
      '<path d="M22 34h22M22 46h22M66 34h22M66 46h18" stroke="' + GREY + '" stroke-width="3" stroke-linecap="round"/></svg>';
  }
  function hat() {
    return '<svg viewBox="0 0 110 100" aria-hidden="true">' +
      '<path d="M20 62q8-44 36-44 22 0 30 30l-6 14z" fill="' + RED + '" stroke="' + INK + '" stroke-width="3.4" stroke-linejoin="round"/>' +
      '<rect x="14" y="58" width="76" height="16" rx="8" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3.4"/>' +
      '<circle cx="88" cy="26" r="11" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3.4"/></svg>';
  }
  function tang() {
    return '<svg viewBox="0 0 110 100" aria-hidden="true">' +
      '<path d="M16 44h78q-4 36-39 36T16 44z" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="3.4" stroke-linejoin="round"/>' +
      '<ellipse cx="55" cy="44" rx="39" ry="9" fill="' + CREAM + '" stroke="' + INK + '" stroke-width="3.2"/>' +
      '<circle cx="40" cy="42" r="9" fill="' + PINK + '" stroke="' + INK + '" stroke-width="2.6"/>' +
      '<circle cx="60" cy="40" r="9" fill="' + WHITE + '" stroke="' + INK + '" stroke-width="2.6"/>' +
      '<circle cx="74" cy="44" r="7" fill="' + PINK + '" stroke="' + INK + '" stroke-width="2.6"/>' +
      '<path d="M22 82h66" stroke="' + INK + '" stroke-width="3.2" stroke-linecap="round"/></svg>';
  }

  /* ---- 蛋盒：3×2 小盒，前方開口，接蛋用 ---- */
  function carton(filled) {
    const W = 124, H = 84, cols = 3, cw = 32, ch = 30, gx = 4, gy = 4;
    const x0 = (W - (cols * cw + (cols - 1) * gx)) / 2, y0 = 16;
    let slots = '';
    for (let i = 0; i < 6; i++) {
      const c = i % cols, r = (i / cols) | 0, on = i < filled;
      const x = x0 + c * (cw + gx), y = y0 + r * (ch + gy);
      slots += '<g transform="translate(' + x + ',' + y + ') scale(' + (cw / EGGBOX.w) + ',' + (ch / EGGBOX.h) + ')">' +
        '<path d="' + EGGPATH + '" fill="' + (on ? WHITE : '#CFC7B6') + '" stroke="' + (on ? INK : '#A8A092') +
        '" stroke-width="' + (on ? 7 : 5) + '"' + (on ? '' : ' stroke-dasharray="16 13"') + '/></g>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="cartonsvg" aria-hidden="true">' +
      '<rect x="2" y="10" width="' + (W - 4) + '" height="' + (H - 13) + '" rx="9" fill="#E8E2D6" stroke="' + INK + '" stroke-width="3.4"/>' +
      '<path d="M2 19h' + (W - 4) + '" stroke="' + ORANGE + '" stroke-width="3.4" stroke-linecap="round" opacity=".9"/>' +
      slots + '</svg>';
  }

  /* ---- 條碼：等高、不等寬（真條碼的樣子） ---- */
  function barcode(n) {
    n = n || 24;
    let x = 0, bars = '', seed = 11;
    for (let i = 0; i < n; i++) {
      seed = (seed * 41 + 17) % 89;
      const w = 1 + (seed % 3), g = 1 + (seed % 2);
      bars += '<rect x="' + x + '" y="0" width="' + w + '" height="26" fill="' + INK + '"/>';
      x += w + g;
    }
    return '<svg viewBox="0 0 ' + x + ' 26" class="bcsvg" aria-hidden="true">' + bars + '</svg>';
  }

  /* ---- 雪花 ---- */
  function flake(c) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="' + c + '" stroke-width="2.4" stroke-linecap="round">' +
      '<path d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10"/></g></svg>';
  }

  return { hen, egg, book, hat, tang, carton, barcode, flake, EGGPATH, EGGBOX,
           C: { INK, RED, ORANGE, GREY, WHITE, YELLOW, TEAL, CREAM, GREEN, PINK, BROWN, TEALD } };
})();
if (typeof module !== 'undefined') module.exports = ART;

</script>
<script>
(function(){
"use strict";

/* ▼▼▼ 活動網站網址，只要改這一行 ▼▼▼ */
var SITE = "https://medlibevent.my.canva.site/";
/* ▲▲▲ ▲▲▲ */

document.getElementById('siteLink').href = SITE;
document.getElementById('moreLink').href = SITE;

var $ = function(s){ return document.querySelector(s); };
var N = 11;

/* ---------------- 字母格（與紙本版相同） ---------------- */
var GRID = [
  'VGERIATRICM',
  'DCHQWTHHGWE',
  'HSBXQZTKMVL',
  'AWEXQMCJCVD',
  'GKMNHJGJAFE',
  'EVYVIKVTJPR',
  'DFMCWONCJPL',
  'FDTFPARDWHY',
  'TBVVSJMMKGY',
  'OLDERADULTS',
  'KDVQTWKKJCF'
];

/* r/c 由 0 起算 */
var WORDS = [
  { w:'GERIATRIC',   r:0, c:1,  dr:0,  dc:1,  zh:'老年醫學的' },
  { w:'ELDERLY',     r:1, c:10, dr:1,  dc:0,  zh:'年長的' },
  { w:'AGED',        r:3, c:0,  dr:1,  dc:0,  zh:'高齡的' },
  { w:'OLDERADULTS', r:9, c:0,  dr:0,  dc:1,  zh:'年長者', show:'OLDER ADULTS' },
  { w:'SENIOR',      r:2, c:1,  dr:1,  dc:1,  zh:'長者' }
];
var EGG = { w:'SANTA', r:8, c:4, dr:-1, dc:1 };

var found = {}, eggFound = false, hinted = false;

/* ---------------- 靜態圖 ---------------- */
$('#startHenBig').innerHTML = ART.hen({face:'happy', acc:'santa'});
$('#startHen').innerHTML = ART.hen({face:'wink', acc:'santa'})
  + '<div class="bubble lf">聖誕老人們<span class="nb">先來躲貓貓</span>。'
  + '<span class="nb">橫的、直的、斜的都有</span>，你找得到幾個？</div>';

$('#howStart').innerHTML = '<h3>怎麼玩</h3><ol>'
  + '<li>按住第一個字母<span class="nb">拖到最後一個</span>，放開就圈起來。</li>'
  + '<li>也可以<span class="nb">先點第一個字母</span>，再點最後一個。</li>'
  + '<li>橫的、直的、斜的都有，<span class="nb">正著反著拼都算對</span>。</li>'
  + '<li>找出 5 個「老人」的英文說法就通關。<span class="nb">想不出來</span>可以按「看提示」。</li>'
  + '</ol><p class="tip">★ 格子裡還藏了<b>一個彩蛋</b>，是這個季節才出現的那一位。</p>';

/* ---------------- 畫格子 ---------------- */
var cells = $('#cells'), capsEl = $('#caps'), grid = $('#grid');
(function(){
  var h = '';
  for (var r = 0; r < N; r++)
    for (var c = 0; c < N; c++)
      h += '<span class="cell" data-r="' + r + '" data-c="' + c + '">' + GRID[r][c] + '</span>';
  cells.innerHTML = h;
})();
var cellEls = Array.prototype.slice.call(cells.children);
function cellAt(r, c){ return cellEls[r * N + c]; }

function paintWords(){
  var h = '';
  WORDS.forEach(function(o){
    h += '<span class="wd' + (found[o.w] ? ' got' : '') + '">'
       + (hinted || found[o.w] ? (o.show || o.w) : '？？？') + '</span>';
  });
  $('#words').innerHTML = h;
}
function paintCount(){
  var n = 0; WORDS.forEach(function(o){ if (found[o.w]) n++; });
  $('#cnt').textContent = n;
  $('#eggLb').textContent = eggFound ? '彩蛋 ★ SANTA' : '彩蛋 ？';
  $('#eggLb').className = 'egg' + (eggFound ? ' got' : '');
  return n;
}

/* ---------------- 圈起來的膠囊 ---------------- */
function drawCap(o, isEgg){
  var cs = grid.clientWidth / N, len = o.w.length;
  var x1 = (o.c + .5) * cs, y1 = (o.r + .5) * cs;
  var x2 = (o.c + o.dc * (len - 1) + .5) * cs, y2 = (o.r + o.dr * (len - 1) + .5) * cs;
  var d = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
  var ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  var h = cs * .78;
  var el = document.createElement('div');
  el.className = 'cap' + (isEgg ? ' egg' : '');
  el.dataset.key = o.w;
  el.style.left = x1 + 'px'; el.style.top = y1 + 'px';
  el.style.width = (d + h) + 'px'; el.style.height = h + 'px';
  el.style.marginLeft = (-h / 2) + 'px'; el.style.marginTop = (-h / 2) + 'px';
  el.style.transformOrigin = (h / 2) + 'px ' + (h / 2) + 'px';
  el.style.transform = 'rotate(' + ang + 'deg)';
  capsEl.appendChild(el);
}
function redrawCaps(){
  capsEl.innerHTML = '';
  WORDS.forEach(function(o){ if (found[o.w]) drawCap(o, false); });
  if (eggFound) drawCap(EGG, true);
}
window.addEventListener('resize', redrawCaps);

/* ---------------- 選取 ---------------- */
var anchor = null, armed = null, path = [];

function clearSel(){ cellEls.forEach(function(e){ e.classList.remove('sel'); }); }

function posToRC(e){
  var b = grid.getBoundingClientRect(), cs = b.width / N;
  var c = Math.floor((e.clientX - b.left) / cs), r = Math.floor((e.clientY - b.top) / cs);
  return { r: Math.min(Math.max(r, 0), N - 1), c: Math.min(Math.max(c, 0), N - 1) };
}

function makePath(a, b){
  var dr = b.r - a.r, dc = b.c - a.c;
  var adr = Math.abs(dr), adc = Math.abs(dc), sr, sc, len;
  if (adr === 0 && adc === 0){ return [{ r:a.r, c:a.c }]; }
  if (adc === 0 || adr / Math.max(adc, .001) > 2){ sr = dr > 0 ? 1 : -1; sc = 0; len = adr + 1; }
  else if (adr === 0 || adc / Math.max(adr, .001) > 2){ sr = 0; sc = dc > 0 ? 1 : -1; len = adc + 1; }
  else { sr = dr > 0 ? 1 : -1; sc = dc > 0 ? 1 : -1; len = Math.max(adr, adc) + 1; }
  var out = [];
  for (var i = 0; i < len; i++){
    var r = a.r + sr * i, c = a.c + sc * i;
    if (r < 0 || r >= N || c < 0 || c >= N) break;
    out.push({ r:r, c:c });
  }
  return out;
}

function showPath(p){
  clearSel();
  p.forEach(function(q){ cellAt(q.r, q.c).classList.add('sel'); });
}

function flash(msg, face){
  var old = document.querySelector('.pop');
  if (old) old.remove();
  var el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = '<span class="hn">' + ART.hen({ face: face || 'happy' }) + '</span><span>' + msg + '</span>';
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 2600);
}

function check(p){
  if (p.length < 2) return false;
  var s = p.map(function(q){ return GRID[q.r][q.c]; }).join('');
  var rev = s.split('').reverse().join('');
  var hit = null, isEgg = false;
  WORDS.forEach(function(o){ if (!found[o.w] && (s === o.w || rev === o.w)) hit = o; });
  if (!hit && !eggFound && (s === EGG.w || rev === EGG.w)){ hit = EGG; isEgg = true; }
  if (!hit) return false;

  if (isEgg){ eggFound = true; drawCap(EGG, true); flash('彩蛋！聖誕老人本人在這裡。', 'wow'); }
  else {
    found[hit.w] = true;
    drawCap(hit, false);
    flash('找到了：<span class="nb">' + (hit.show || hit.w) + '（' + hit.zh + '）</span>', 'happy');
  }
  paintWords();
  var n = paintCount();
  if (n === WORDS.length) setTimeout(done, 900);
  return true;
}

grid.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var q = posToRC(e);
  if (armed){                      /* 點兩下：第二下完成 */
    var p = makePath(armed, q);
    showPath(p);
    if (!check(p)) setTimeout(clearSel, 260); else clearSel();
    armed = null; anchor = null; return;
  }
  anchor = q; path = [q]; showPath(path);
  try { grid.setPointerCapture(e.pointerId); } catch (err) {}
});

grid.addEventListener('pointermove', function(e){
  if (!anchor) return;
  path = makePath(anchor, posToRC(e));
  showPath(path);
});

['pointerup','pointercancel'].forEach(function(ev){
  grid.addEventListener(ev, function(e){
    if (!anchor) return;
    if (path.length < 2){        /* 沒拖動 → 進入點兩下模式 */
      armed = anchor; anchor = null;
      return;
    }
    if (!check(path)) setTimeout(clearSel, 260); else clearSel();
    anchor = null; armed = null; path = [];
  });
});

/* ---------------- 流程 ---------------- */
function show(id){
  ['s-start','s-play','s-end'].forEach(function(s){
    document.getElementById(s).classList.toggle('on', s === id);
  });
  window.scrollTo(0, 0);
}

function done(){
  var more = eggFound ? '' : '<p style="margin-top:7px">彩蛋還沒找到——<span class="nb">再看一次格子</span>，'
    + '有一位這個季節才出現的先生還躲在裡面。</p>';
  $('#resWrap').innerHTML =
    '<div class="res"><div class="ttl">五個都找到了！</div>'
    + '<p>elderly、seniors、older adults、geriatric、aged——'
    + '同一群人，作者各寫各的。少想一個，就<span class="nb">可能少看到一批文獻</span>。</p>'
    + more
    + '<div class="row" style="margin-top:12px"><button class="btn sm" id="btnToEnd">拿通關密語字母</button></div></div>';
  $('#btnToEnd').onclick = finish;
}

function finish(){
  $('#endNote').innerHTML = eggFound
    ? '<b>彩蛋也找到了</b>：SANTA 躲在斜的那一條。<br>'
      + '阿雞碎碎念：「一行放一個詞就好；<span class="nb">用空格擠在同一行</span>，阿雞會以為它們是同一個詞唷。」'
    : '阿雞碎碎念：「一行放一個詞就好；<span class="nb">用空格擠在同一行</span>，阿雞會以為它們是<span class="nb">同一個詞</span>唷。」'
      + '<br>（格子裡還有一個<b>彩蛋</b>沒被找到，下次再試試。）';
  $('#endHen').innerHTML = ART.hen({face:'happy', acc:'santa'})
    + '<div class="bubble lf">同義詞一行一個，<span class="nb">OR 和括號</span>阿雞幫你串好。</div>';
  show('s-end');
}

function start(){
  found = {}; eggFound = false; hinted = false;
  capsEl.innerHTML = ''; clearSel();
  anchor = null; armed = null; path = [];
  $('#resWrap').innerHTML = '';
  paintWords(); paintCount();
  show('s-play');
  requestAnimationFrame(redrawCaps);
}

$('#btnStart').onclick = start;
$('#btnAgain').onclick = start;
$('#btnHome').onclick  = function(){ show('s-start'); };
$('#btnHint').onclick  = function(){
  hinted = true; paintWords();
  this.textContent = '提示已開';
  this.disabled = true;
};
paintWords(); paintCount();

})();
</script>
</body>
</html>
